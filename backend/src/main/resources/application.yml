server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ordexa-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ordexa_db}
    username: ${SPRING_DATASOURCE_USERNAME:ordexa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ordexa_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

ordexa:
  jwt:
    secret: ${ORDEXA_JWT_SECRET:dGhpc2lzYXNlY3JldGtleWZvcm9yZGV4YWJhY2tlbmRqd3RhdXRoZW50aWNhdGlvbnNlY3VyZXN5c3RlbQ==}
    expiration-ms: ${ORDEXA_JWT_EXPIRATION_MS:86400000} # 24 Hours
