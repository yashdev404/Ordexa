server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ordexa-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ordexa_db
    username: ordexa_user
    password: ordexa_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

ordexa:
  jwt:
    secret: dGhpc2lzYXNlY3JldGtleWZvcm9yZGV4YWJhY2tlbmRqd3RhdXRoZW50aWNhdGlvbnNlY3VyZXN5c3RlbQ==
    expiration-ms: 86400000 # 24 Hours
